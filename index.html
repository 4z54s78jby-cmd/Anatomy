<script>
const QUESTIONS = [{"q": "The urogenital system is derived primarily from which embryonic tissue?", "opts": ["Paraxial mesoderm", "Intermediate mesoderm", "Lateral plate mesoderm", "Endoderm"], "a": 1, "why": "The lecture states that the urogenital system develops from intraembryonic intermediate mesoderm. Paraxial mesoderm forms somites; lateral plate and endoderm do not form the nephrogenic system.", "optionWhy": ["Why this is wrong: Paraxial mesoderm is shown separately from intermediate mesoderm; the urogenital system is derived from the intermediate mesoderm.", "Correct. The lecture states that the urogenital system develops from intraembryonic intermediate mesoderm. Paraxial mesoderm forms somites; lateral plate and endoderm do not form the nephrogenic system.", "Why this is wrong: The lecture identifies intraembryonic intermediate mesoderm—not lateral plate mesoderm—as the source of the urogenital system.", "Why this is wrong: Endoderm is not the source named for the urogenital ridge; the lecture names intraembryonic intermediate mesoderm."]}, {"q": "Which part of the urogenital ridge gives rise to the urinary system?", "opts": ["Genital ridge", "Nephrogenic cord", "Paramesonephric duct", "Cloacal membrane"], "a": 1, "why": "The nephrogenic cord is the urinary-system component of the urogenital ridge.", "optionWhy": ["Why this is wrong: The urinary part of the urogenital ridge is specifically called the nephrogenic cord; the genital component is distinct.", "Correct. The nephrogenic cord is the urinary-system component of the urogenital ridge.", "Why this is wrong: The lecture's urinary-system primordium is the nephrogenic cord, not the paramesonephric duct.", "Why this is wrong: The cloacal membrane is shown caudally; the urinary system arises from the nephrogenic cord of the urogenital ridge."]}, {"q": "The three kidney systems develop in which sequence?", "opts": ["Mesonephros → pronephros → metanephros", "Pronephros → mesonephros → metanephros", "Metanephros → mesonephros → pronephros", "Pronephros → metanephros → mesonephros"], "a": 1, "why": "The sequence is pronephros (first), mesonephros (second), and metanephros (third and permanent). Their development overlaps in time and space.", "optionWhy": ["Why this is wrong: This reverses the first two stages. The lecture's order is pronephros first, mesonephros second, metanephros third and permanent.", "Correct. The sequence is pronephros (first), mesonephros (second), and metanephros (third and permanent). Their development overlaps in time and space.", "Why this is wrong: This reverses the developmental order. The lecture lists pronephros → mesonephros → metanephros.", "Why this is wrong: The metanephros is the third stage, after the mesonephros; it is the permanent kidney."]}, {"q": "The pronephros first develops during the:", "opts": ["Third week", "Beginning of the fourth week", "Fifth week", "Eighth week"], "a": 1, "why": "The pronephros develops in the fourth week, in the cervical region.", "optionWhy": ["Why this is wrong: The lecture places pronephros development in the fourth week, not the third.", "Correct. The pronephros develops in the fourth week, in the cervical region.", "Why this is wrong: The fifth week is when the metanephros develops; pronephros begins in the fourth week.", "Why this is wrong: The lecture places pronephros in the fourth week; the eighth week is not given as its starting time."]}, {"q": "The pronephros develops opposite which somites according to the lecture?", "opts": ["1st–7th", "7th–14th", "14th–28th", "28th–35th"], "a": 1, "why": "The pronephros lies opposite the 7th to 14th somites and is formed from seven pairs of nephrotomes.", "optionWhy": ["Why this is wrong: The lecture places pronephros opposite somites 7th–14th; 1st–7th is not the stated range.", "Correct. The pronephros lies opposite the 7th to 14th somites and is formed from seven pairs of nephrotomes.", "Why this is wrong: Somites 14–28 are the range for mesonephric tubules; pronephros is opposite somites 7–14.", "Why this is wrong: The lecture gives 7–14 for pronephros and 14–28 for mesonephros; 28–35 is not assigned to pronephros."]}, {"q": "Which direction does the ventral end of each pronephric tubule open?", "opts": ["Laterally into the mesonephric duct", "Medially into the intraembryonic coelom", "Caudally into the cloaca", "Directly into the dorsal aorta"], "a": 1, "why": "The ventral end opens medially into the intraembryonic coelom; the dorsal ends grow laterally and fuse to form the pronephric duct.", "optionWhy": ["Why this is wrong: The ventral end opens medially into the intraembryonic coelom. It is the dorsal ends that grow laterally and fuse to form the pronephric duct.", "Correct. The ventral end opens medially into the intraembryonic coelom; the dorsal ends grow laterally and fuse to form the pronephric duct.", "Why this is wrong: The tubule's ventral end opens medially into the intraembryonic coelom; the pronephric duct itself grows caudally to the cloaca.", "Why this is wrong: The lecture says the pronephric tubule opens into the intraembryonic coelom, not the dorsal aorta."]}, {"q": "The pronephric duct grows caudally and opens into the:", "opts": ["Amniotic cavity", "Cloaca", "Allantois", "Urogenital sinus"], "a": 1, "why": "The pronephric duct grows caudally and opens into the cloaca on each side.", "optionWhy": ["Why this is wrong: The pronephric duct opens into the cloaca. The amniotic cavity appears in the separate fetal-urine circulation diagram.", "Correct. The pronephric duct grows caudally and opens into the cloaca on each side.", "Why this is wrong: The pronephric duct grows caudally and opens into the cloaca on each side; the lecture does not describe it opening into the allantois.", "Why this is wrong: The lecture specifically says the pronephric duct opens into the cloaca."]}, {"q": "Which statement correctly describes the fate of the pronephros?", "opts": ["Tubules persist and form nephrons", "Tubules disappear while the duct persists", "Both tubules and duct disappear", "The duct forms the ureteric bud directly after disappearing"], "a": 1, "why": "Pronephric tubules disappear; the pronephric duct persists and is used by the mesonephros.", "optionWhy": ["Why this is wrong: Pronephric tubules disappear. The pronephric duct persists and is used by the mesonephros.", "Correct. Pronephric tubules disappear; the pronephric duct persists and is used by the mesonephros.", "Why this is wrong: Only the pronephric tubules disappear; the pronephric duct persists for the mesonephros.", "Why this is wrong: The pronephric duct does not disappear at this stage: it persists as the duct used by the mesonephros. The ureteric bud later arises from the lower end of the mesonephric duct."]}, {"q": "Approximately how many S-shaped mesonephric tubules are described?", "opts": ["7", "14", "28", "70"], "a": 3, "why": "The lecture describes about 70 S-shaped mesonephric tubules, opposite somites 14–28.", "optionWhy": ["Why this is wrong: The lecture describes approximately 70 S-shaped mesonephric tubules, not seven.", "Why this is wrong: The number of mesonephric tubules given is about 70; 14 is part of the pronephric somite range (7th–14th), not the tubule count.", "Why this is wrong: The lecture gives about 70 mesonephric tubules. Somites 14–28 describe their level, not their number.", "Correct. The lecture describes about 70 S-shaped mesonephric tubules, opposite somites 14–28."]}, {"q": "Mesonephric tubules are formed opposite somites:", "opts": ["7–14", "14–28", "28–35", "1–7"], "a": 1, "why": "The stated somite range for mesonephric tubules is 14–28.", "optionWhy": ["Why this is wrong: The lecture describes approximately 70 S-shaped mesonephric tubules, not seven.", "Correct. The stated somite range for mesonephric tubules is 14–28.", "Why this is wrong: The lecture gives about 70 mesonephric tubules. Somites 14–28 describe their level, not their number.", "Why this is wrong: The lecture describes approximately 70 S-shaped mesonephric tubules, not seven."]}, {"q": "The lateral end of a mesonephric tubule opens into the:", "opts": ["Intraembryonic coelom", "Mesonephric (Wolffian) duct", "Cloaca directly", "Collecting duct"], "a": 1, "why": "The lateral end opens into the pronephric duct, which is then called the mesonephric or Wolffian duct.", "optionWhy": ["Why this is wrong: For mesonephric tubules, the lateral end opens into the mesonephric (Wolffian) duct. The coelomic opening described belongs to the ventral end of pronephric tubules.", "Correct. The lateral end opens into the pronephric duct, which is then called the mesonephric or Wolffian duct.", "Why this is wrong: The mesonephric tubule's lateral end opens into the mesonephric duct. It is the duct that reaches the cloaca.", "Why this is wrong: The collecting duct is connected to the distal end of metanephric tubules; the mesonephric tubules open laterally into the mesonephric duct."]}, {"q": "At the medial end of a mesonephric tubule, a branch from the dorsal aorta contributes to formation of:", "opts": ["Renal pelvis and calyces", "Glomerulus and Bowman's capsule", "Ureter and bladder trigone", "Proximal and distal convoluted tubules only"], "a": 1, "why": "The medial end enlarges and is invaginated by a branch from the dorsal aorta, forming a glomerulus and Bowman's capsule.", "optionWhy": ["Why this is wrong: The renal pelvis and calyces are formed by branching of the ureteric bud, not by the medial end of a mesonephric tubule.", "Correct. The medial end enlarges and is invaginated by a branch from the dorsal aorta, forming a glomerulus and Bowman's capsule.", "Why this is wrong: The lecture associates the ureteric bud with the collecting system and notes the mesonephric duct's contribution to the trigone; the medial end of the mesonephric tubule forms a glomerulus and Bowman's capsule.", "Why this is wrong: PCT and DCT are parts of the nephron formed from the metanephric S-shaped tubule. The specific medial-end event here is formation of glomerulus and Bowman's capsule."]}, {"q": "Which of the following is a derivative of mesonephric tubules in the male?", "opts": ["Seminal vesicle", "Vasa efferentia", "Vas deferens", "Ejaculatory duct"], "a": 1, "why": "Male mesonephric tubule derivatives listed include vasa efferentia, head of epididymis, paradidymis and aberrant ductules. The duct forms vas deferens and related ducts.", "optionWhy": ["Why this is wrong: Seminal vesicles are derived from the mesonephric duct in the male; vasa efferentia are derived from mesonephric tubules.", "Correct. Male mesonephric tubule derivatives listed include vasa efferentia, head of epididymis, paradidymis and aberrant ductules. The duct forms vas deferens and related ducts.", "Why this is wrong: Vas deferens is a mesonephric-duct derivative. The question asks for a tubule derivative; the lecture lists vasa efferentia among these.", "Why this is wrong: Ejaculatory duct is listed under mesonephric-duct derivatives, whereas vasa efferentia arise from mesonephric tubules."]}, {"q": "Which structure is derived from the mesonephric duct in the male?", "opts": ["Vasa efferentia", "Body and tail of epididymis", "Head of epididymis", "Paradidymis"], "a": 1, "why": "The duct gives body and tail of epididymis, vas deferens, seminal vesicles and ejaculatory duct. Vasa efferentia and head of epididymis are tubule derivatives.", "optionWhy": ["Why this is wrong: Vasa efferentia are derived from mesonephric tubules, not the mesonephric duct. The duct forms body and tail of epididymis, vas deferens, seminal vesicles and ejaculatory duct.", "Correct. The duct gives body and tail of epididymis, vas deferens, seminal vesicles and ejaculatory duct. Vasa efferentia and head of epididymis are tubule derivatives.", "Why this is wrong: The head of epididymis is listed under mesonephric-tubule derivatives; the body and tail are listed under mesonephric-duct derivatives.", "Why this is wrong: Paradidymis is listed as a mesonephric-tubule derivative, not a mesonephric-duct derivative."]}, {"q": "A remnant of mesonephric tubules in the female is the:", "opts": ["Gartner's duct", "Epoophoron", "Ureter", "Fallopian tube"], "a": 1, "why": "The female mesonephric tubule remnants listed are epoophoron and paroophoron; Gartner's duct is from the mesonephric duct.", "optionWhy": ["Why this is wrong: Gartner's duct is a remnant of the mesonephric duct. The female mesonephric-tubule remnants listed are epoophoron and paroophoron.", "Correct. The female mesonephric tubule remnants listed are epoophoron and paroophoron; Gartner's duct is from the mesonephric duct.", "Why this is wrong: The ureter is formed from the ureteric bud; the female mesonephric-tubule remnants listed are epoophoron and paroophoron.", "Why this is wrong: The lecture shows the Fallopian tube as part of the female genital tract, not as a mesonephric-tubule remnant. Epoophoron and paroophoron are the listed tubule remnants."]}, {"q": "Gartner's duct in the female is a remnant of the:", "opts": ["Pronephric tubule", "Mesonephric duct", "Ureteric bud", "Metanephric cap"], "a": 1, "why": "Gartner's duct is listed as a female remnant of the mesonephric (Wolffian) duct.", "optionWhy": ["Why this is wrong: Gartner's duct is listed as a remnant of the mesonephric (Wolffian) duct, not the pronephric tubule.", "Correct. Gartner's duct is listed as a female remnant of the mesonephric (Wolffian) duct.", "Why this is wrong: The ureter is formed from the ureteric bud; the female mesonephric-tubule remnants listed are epoophoron and paroophoron.", "Why this is wrong: The metanephric cap forms the excretory system of the permanent kidney; Gartner's duct is a mesonephric-duct remnant."]}, {"q": "The permanent kidney (metanephros) first develops in the:", "opts": ["Fourth week", "Fifth week", "Sixth month", "At birth"], "a": 1, "why": "The metanephros develops in the fifth week and becomes the permanent kidney.", "optionWhy": ["Why this is wrong: The fourth week is associated with the first kidney, pronephros. The permanent metanephros develops in the fifth week.", "Correct. The metanephros develops in the fifth week and becomes the permanent kidney.", "Why this is wrong: The lecture places metanephros development in the fifth week, not the sixth month.", "Why this is wrong: The metanephros begins developing in the fifth week and becomes the permanent kidney; it does not first appear at birth."]}, {"q": "The metanephros develops initially in the:", "opts": ["Cervical region", "Thoracic region", "Lower lumbar and sacral regions", "Upper lumbar region only"], "a": 2, "why": "The lecture places the developing metanephros in the lower lumbar and sacral regions before its ascent.", "optionWhy": ["Why this is wrong: The cervical region is the site of pronephros development; metanephros begins in the lower lumbar and sacral regions.", "Why this is wrong: The thoracic and upper lumbar regions are associated with mesonephros; metanephros begins in lower lumbar and sacral regions.", "Correct. The lecture places the developing metanephros in the lower lumbar and sacral regions before its ascent.", "Why this is wrong: The lecture gives lower lumbar and sacral regions for metanephros, not upper lumbar alone."]}, {"q": "The permanent kidney develops from which two sources?", "opts": ["Pronephric duct and cloaca", "Ureteric bud and metanephric cap", "Mesonephric tubules and dorsal aorta", "Urogenital sinus and allantois"], "a": 1, "why": "The two sources are the ureteric bud and metanephric cap (metanephric mesoderm/blastema).", "optionWhy": ["Why this is wrong: The permanent kidney has two sources: ureteric bud and metanephric cap. The cloaca is where the pronephric/mesonephric duct opens.", "Correct. The two sources are the ureteric bud and metanephric cap (metanephric mesoderm/blastema).", "Why this is wrong: The two kidney-forming sources are ureteric bud and metanephric cap. A dorsal-aortic branch contributes to glomerulus formation, but is not one of the two primordia.", "Why this is wrong: The pronephric duct grows caudally and opens into the cloaca on each side; the lecture does not describe it opening into the allantois."]}, {"q": "The ureteric bud arises as a hollow diverticulum from the:", "opts": ["Upper end of pronephric duct", "Lower end of mesonephric duct near its junction with cloaca", "Metanephric cap", "Dorsal aorta"], "a": 1, "why": "It arises from the lower end of the mesonephric duct at its junction with the cloaca.", "optionWhy": ["Why this is wrong: The ureteric bud arises from the lower end of the mesonephric duct at its junction with the cloaca.", "Correct. It arises from the lower end of the mesonephric duct at its junction with the cloaca.", "Why this is wrong: The metanephric cap forms the excretory system of the permanent kidney; Gartner's duct is a mesonephric-duct remnant.", "Why this is wrong: The ureteric bud arises from the mesonephric duct. A branch from the dorsal aorta later helps form the glomerulus and Bowman's capsule."]}, {"q": "Which component forms the collecting system of the kidney?", "opts": ["Metanephric cap", "Ureteric bud", "Mesonephric tubules", "Pronephric tubules"], "a": 1, "why": "The ureteric bud forms the collecting system; the metanephric cap forms the excretory system/nephrons.", "optionWhy": ["Why this is wrong: The metanephric cap forms the excretory system of the permanent kidney; Gartner's duct is a mesonephric-duct remnant.", "Correct. The ureteric bud forms the collecting system; the metanephric cap forms the excretory system/nephrons.", "Why this is wrong: The mesonephric tubules are part of the temporary second kidney; the permanent kidney's collecting system comes from the ureteric bud.", "Why this is wrong: Gartner's duct is listed as a remnant of the mesonephric (Wolffian) duct, not the pronephric tubule."]}, {"q": "Which component forms the excretory system of the kid const letters = ["A","B","C","D"];
const answers = {};
let submitted = false, onlyUnanswered = false;
function render(){
 const root=document.getElementById('quiz'); root.innerHTML='';
 QUESTIONS.forEach((item,i)=>{
  if(onlyUnanswered && answers[i]!==undefined) return;
  const card=document.createElement('section');card.className='question';card.id='q'+i;
  const top=document.createElement('div');top.className='qtop';top.innerHTML=`<span>QUESTION ${i+1} / ${QUESTIONS.length}</span><span>${answers[i]===undefined?'Not answered':'Answered'}</span>`;
  const title=document.createElement('h2');title.textContent=item.q;card.append(top,title);
  item.opts.forEach((opt,j)=>{
   const label=document.createElement('label');label.className='option';
   if(submitted && j===item.a) label.classList.add('correct');
   if(submitted && answers[i]===j && j!==item.a) label.classList.add('wrong');
   const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=j;radio.checked=answers[i]===j;radio.disabled=submitted;
   radio.addEventListener('change',()=>{answers[i]=j;updateProgress();render();});
   const text=document.createElement('span');text.innerHTML=`<b>${letters[j]}.</b> ${escapeHtml(opt)}`;
   label.append(radio,text);card.append(label);
  });
  const fb=document.createElement('div');fb.className='feedback'+(submitted?' show':'');
  if(submitted){
   const head=document.createElement('strong');head.textContent=answers[i]===item.a?'Correct':'Incorrect — correct answer: '+letters[item.a];
   const body=document.createElement('div');body.className='explain';body.textContent=item.why;
   fb.append(head,body);
   const detail=document.createElement('div');detail.className='option-explanations';detail.style.marginTop='10px';
   item.opts.forEach((o,j)=>{
    const row=document.createElement('div');row.className='option-explanation'+(j===item.a?' is-correct':'');
    const label=document.createElement('b');label.textContent=letters[j]+(j===item.a?' — Correct answer':' — Incorrect option');
    const choice=document.createElement('div');choice.className='choice-text';choice.textContent=o;
    const reason=document.createElement('div');reason.className='reason-text';reason.textContent=item.optionWhy[j];
    row.append(label,choice,reason);detail.append(row);
   });
   fb.append(detail);
  }
  card.append(fb);root.append(card);
 });
 updateProgress();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function updateProgress(){
 const n=Object.keys(answers).length, total=QUESTIONS.length;
 document.getElementById('progressText').textContent=`Answered ${n} of ${total}`;
 document.getElementById('bottomCount').textContent=`${n} / ${total} answered`;
 document.getElementById('bar').style.width=(n/total*100)+'%';
}
function submitQuiz(){
 if(submitted)return;
 const n=Object.keys(answers).length;
 if(n<QUESTIONS.length && !confirm(`You answered ${n} of ${QUESTIONS.length}. Submit anyway? Unanswered questions will count as incorrect.`))return;
 submitted=true;onlyUnanswered=false;render();
 let score=0;QUESTIONS.forEach((q,i)=>{if(answers[i]===q.a)score++;});
 const pct=Math.round(score/QUESTIONS.length*100);
 const result=document.getElementById('result');result.className='result show';
 result.innerHTML=`<div class="small">EXAM RESULT</div><div class="score">${score} / ${QUESTIONS.length}</div><h2>${pct}% — ${pct>=85?'Excellent work':pct>=70?'Good performance':pct>=50?'Keep revising':'Needs more revision'}</h2><p>You can now review every question with its correct answer and explanation.</p><button class="secondary" onclick="window.scrollTo({top:0,behavior:'smooth'})">Review exam</button> <button onclick="restart()">Retake exam</button>`;
 document.getElementById('submitBtn').disabled=true;
 result.scrollIntoView({behavior:'smooth',block:'center'});
}
function toggleUnanswered(){onlyUnanswered=!onlyUnanswered;document.getElementById('reviewBtn').textContent=onlyUnanswered?'Show all questions':'Review unanswered';render();}
function restart(){for(const k in answers)delete answers[k];submitted=false;onlyUnanswered=false;document.getElementById('submitBtn').disabled=false;document.getElementById('result').className='result';document.getElementById('reviewBtn').textContent='Review unanswered';render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script>
