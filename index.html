<script>const qs=[["Widest part of male urethra?", ["Pre-prostatic", "Prostatic", "Membranous", "Penile"], 1, ["Pre-prostatic is 1–1.5 cm.", "Correct: prostatic is the widest, about 3 cm.", "Membranous is shortest and least dilatable.", "Penile is longest, about 15 cm."]], ["Pre-prostatic part is surrounded by:", ["External sphincter", "Internal sphincter", "Bulbourethral glands", "Prostatic ducts"], 1, ["External surrounds membranous urethra.", "Correct: internal sphincter surrounds the intramural part at bladder neck.", "Glands lie beside membranous urethra.", "Prostatic ducts open into prostatic urethra."]], ["Midline longitudinal elevation in posterior prostatic urethra:", ["Urethral sinus", "Seminal colliculus", "Urethral crest", "Prostatic utricle"], 2, ["Sinus is a depression.", "Colliculus is a rounded elevation on the crest.", "Correct: urethral crest is the longitudinal midline elevation.", "Utricle is an opening on the colliculus."]], ["Prostatic ducts open into:", ["Urethral crest", "Urethral sinuses", "External orifice", "Navicular fossa"], 1, ["Crest is the midline elevation.", "Correct: sinuses lie on either side of crest and receive prostatic ducts.", "External orifice is distal.", "Navicular fossa is terminal penile dilatation."]], ["Seminal colliculus openings:", ["3 ejaculatory", "2 utricle + 1 ejaculatory", "1 central utricle + 2 lateral ejaculatory", "1 central prostatic duct + 2 bulbourethral"], 2, ["There are two ejaculatory openings.", "There is one central utricle opening.", "Correct: central prostatic utricle, two lateral ejaculatory ducts.", "Not the arrangement described."]], ["Shortest, narrowest, least dilatable part per lecture:", ["Prostatic", "Pre-prostatic", "Membranous", "Penile"], 2, ["Prostatic is widest.", "Pre-prostatic is 1–1.5 cm.", "Correct: membranous is about 2 cm and described as shortest, narrowest and least dilatable.", "Penile is longest."]], ["Segment in deep perineal pouch surrounded by external sphincter:", ["Pre-prostatic", "Prostatic", "Membranous", "Terminal penile"], 2, ["Pre-prostatic is at bladder neck.", "Prostatic traverses prostate.", "Correct: membranous passes through deep perineal pouch.", "Terminal penile segment is in glans."]], ["Bulbourethral ducts open into:", ["Prostatic", "Membranous", "Spongy", "Pre-prostatic"], 2, ["Not the prostatic part.", "They pierce perineal membrane; they do not open into membranous part.", "Correct: they open into spongy urethra.", "Pre-prostatic is near bladder neck."]], ["Beginning dilatation of penile urethra:", ["Navicular fossa", "Interbulbar fossa", "Urethral sinus", "Prostatic utricle"], 1, ["Navicular is terminal.", "Correct: interbulbar fossa is at beginning.", "Sinus is in prostatic urethra.", "Utricle is an opening on colliculus."]], ["Terminal dilatation within glans:", ["Interbulbar fossa", "Urethral sinus", "Navicular fossa", "Seminal colliculus"], 2, ["Interbulbar is proximal.", "Sinus is prostatic.", "Correct: navicular fossa is terminal.", "Colliculus is prostatic."]], ["Penile urethra lies within:", ["One corpus cavernosum", "Between corpora cavernosa", "Corpus spongiosum", "Outside erectile tissue"], 2, ["Not in a cavernosum.", "Not between the two.", "Correct: it passes through corpus spongiosum.", "It is enclosed within spongiosum."]], ["External urethral orifice:", ["Widest", "At bladder neck", "At glans tip; described as narrowest", "Opens into utricle"], 2, ["Prostatic is widest.", "Bladder neck has internal orifice.", "Correct: at tip of glans and described as narrowest in course slide.", "Utricle is a prostatic opening."]], ["Internal urethral sphincter:", ["Striated in deep pouch", "Circular smooth around bladder neck", "Voluntary pudendal", "Around penile urethra"], 1, ["Describes external sphincter.", "Correct: circular smooth muscle around bladder neck.", "External is striated and voluntary.", "Internal is at bladder neck."]], ["Voluntary interruption of urination:", ["Internal sphincter", "External sphincter", "Detrusor only", "Prostatic muscle"], 1, ["Internal is involuntary.", "Correct: external sphincter is striated and voluntary.", "Detrusor is bladder muscle.", "Not the voluntary sphincter."]], ["Prevents retrograde ejaculation:", ["External sphincter", "Internal sphincter", "Anal sphincter", "Bulbospongiosus"], 1, ["External controls voluntary urination.", "Correct: internal sphincter contracts during ejaculation.", "Anal sphincter controls anal canal.", "Not the sphincter described for this function."]], ["Somatic supply of external sphincter:", ["Inferior hypogastric plexus", "Vagus", "Pudendal nerve", "Femoral"], 2, ["Autonomic plexus is not somatic supply.", "Vagus is unrelated.", "Correct: pudendal nerve supplies external sphincter.", "Femoral is unrelated."]], ["Female external urethral orifice opens:", ["Behind vaginal opening", "Vestibule between clitoris and vaginal opening", "Tip of clitoris", "Inside vagina"], 1, ["It is anterior to vaginal orifice.", "Correct: opens into vestibule between clitoris and vaginal opening.", "Not at clitoral tip.", "It opens separately into vestibule."]], ["Female urethra:", ["20 cm and narrow", "4–5 cm, wider and shorter", "15 cm through spongiosum", "3 cm through prostate"], 1, ["Not female dimensions.", "Correct: 4–5 cm, wider and shorter than male.", "Does not describe female urethra.", "Female urethra is not surrounded by prostate."]], ["Female urethra embedded in:", ["Posterior vaginal wall", "Anterior vaginal wall", "Cervix", "Posterior bladder wall"], 1, ["Lecture specifies anterior wall.", "Correct: embedded in anterior vaginal wall throughout course.", "Does not traverse cervix.", "Not the stated relation."]], ["Female sphincter urethrae compared with male:", ["Stronger", "Equal", "Weaker", "Absent"], 2, ["Lecture says weaker.", "Lecture says weaker.", "Correct: described as weak compared with male.", "It is present."]], ["Lymph from prostatic and membranous urethra:", ["Deep inguinal", "Superficial inguinal", "Internal iliac", "Popliteal"], 2, ["Deep inguinal drains spongy part.", "Not the stated drainage.", "Correct: internal iliac nodes.", "Unrelated."]], ["Lymph from spongy urethra:", ["Internal iliac", "Deep inguinal", "External iliac", "Para-aortic"], 1, ["Internal iliac drains prostatic and membranous.", "Correct: deep inguinal nodes.", "Not listed in lecture.", "Not listed."]], ["Nerve supply of prostatic urethra:", ["Perineal nerve", "Inferior hypogastric plexus", "Pudendal directly", "Femoral"], 1, ["Perineal nerve supplies membranous and spongy.", "Correct: inferior hypogastric plexus.", "Pudendal via perineal nerve is listed for other parts.", "Unrelated."]], ["Nerve supply of membranous and spongy urethra:", ["Inferior hypogastric plexus", "Perineal nerve, branch of pudendal", "Obturator", "Ilioinguinal"], 1, ["Listed for prostatic urethra.", "Correct: perineal nerve, branch of pudendal.", "Not listed.", "Not listed."]], ["Correct proximal-to-distal sequence:", ["Prostatic, pre-prostatic, penile, membranous", "Pre-prostatic, prostatic, membranous, penile", "Membranous, prostatic, pre-prostatic, penile", "Pre-prostatic, membranous, prostatic, penile"], 1, ["Incorrect order.", "Correct: bladder → pre-prostatic → prostatic → membranous → penile.", "Incorrect order.", "Prostatic precedes membranous."]], ["Segment 1–1.5 cm between bladder neck and prostate base:", ["Prostatic", "Membranous", "Pre-prostatic", "Penile"], 2, ["Prostatic is 3 cm.", "Membranous is 2 cm.", "Correct: pre-prostatic is 1–1.5 cm.", "Penile is 15 cm."]], ["Internal sphincter location and ejaculation action:", ["Deep pouch; relaxes", "Bladder neck; contracts", "Corpus spongiosum; contracts in urination", "Prostate apex; voluntary"], 1, ["Deep pouch is external sphincter location.", "Correct: internal sphincter at bladder neck contracts during ejaculation.", "Wrong location and action.", "It is involuntary at bladder neck."]], ["Which length pairing is INCORRECT?", ["Pre-prostatic 1–1.5 cm", "Prostatic 3 cm", "Membranous 2 cm", "Penile 3 cm"], 3, ["Correct pairing.", "Correct pairing.", "Correct pairing.", "Correct answer: penile is about 15 cm, not 3 cm."]]];let i=0,ans={},checked={},done=false;const L=['A','B','C','D'];function render(){let a=document.getElementById('app');if(done){let s=qs.filter((q,n)=>ans[n]===q[2]).length;a.innerHTML=`<div class="score"><h2>Exam completed</h2><strong>${s}/${qs.length}</strong><p>${Math.round(s/qs.length*100)}%</p><button onclick="restart()">Restart exam</button></div><h2>Answer review</h2>`+qs.map((q,n)=>`<div class="review"><b>Q${n+1}: ${ans[n]===q[2]?'Correct':'Incorrect'}</b><p>${q[0]}</p><small>Correct: ${L[q[2]]}. ${q[1][q[2]]}</small></div>`).join('');return}let q=qs[i],c=!!checked[i];a.innerHTML=`<b>Question ${i+1} / ${qs.length}</b><div class="bar"><div class="fill" style="width:${(i+1)/qs.length*100}%"></div></div><div class="muted">Answered ${Object.keys(checked).length} of ${qs.length}</div><h2>${q[0]}</h2>`+q[1].map((o,j)=>`<label><input type="radio" name="v" value="${j}" ${ans[i]===j?'checked':''} ${c?'disabled':''}> <b>${L[j]}.</b> ${o}</label>`).join('')+(c?explain(q):`<button id="sub" ${ans[i]===undefined?'disabled':''} onclick="submitQ()">Submit answer</button>`)+`<div class="nav"><button class="secondary" onclick="move(-1)" ${i===0?'disabled':''}>Previous</button><button onclick="next()" ${!c?'disabled':''}>${i===qs.length-1?'Finish exam':'Next →'}</button></div>`;document.querySelectorAll('input[name=v]').forEach(x=>x.onchange=e=>{ans[i]=+e.target.value;document.getElementById('sub').disabled=false})}
function explain(q){return `<div class="feedback"><h3 class="${ans[i]===q[2]?'good':'bad'}">${ans[i]===q[2]?'Correct!':'Incorrect'}</h3><b>Correct answer: ${L[q[2]]}. ${q[1][q[2]]}</b><div class="ex"><b>Explanation of all options</b>${q[1].map((o,j)=>`<p><b class="${j===q[2]?'good':'bad'}">${L[j]}. ${o}</b><br>${q[3][j]}</p>`).join('')}</div></div>`}
function submitQ(){checked[i]=true;render()}function move(d){i=Math.max(0,Math.min(qs.length-1,i+d));render()}function next(){if(i===qs.length-1)done=true;else i++;render()}function restart(){i=0;ans={};checked={};done=false;render()}render();</script></html>
