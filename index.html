<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Development of the Kidney & Ureter — Medical Exam</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#64708a;--accent:#3157d5;--line:#e3e8f2;--good:#16834a;--bad:#c33b42}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:linear-gradient(120deg,#14285c,#3157d5);color:white;padding:28px 18px}
.wrap{max-width:900px;margin:auto;padding:0 14px}
h1{font-size:clamp(23px,4vw,34px);line-height:1.2;margin:0 0 8px}
header p{margin:0;color:#e4eaff}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{background:#ffffff20;border:1px solid #ffffff35;border-radius:30px;padding:6px 12px;font-size:13px}
main{padding:22px 0 60px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.progress{height:8px;background:#e0e5f0;border-radius:9px;overflow:hidden;flex:1;min-width:140px}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:650;cursor:pointer;background:var(--accent);color:white}
button.secondary{background:#e8edfb;color:#243c9a}button:disabled{opacity:.45;cursor:not-allowed}
.question{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 14px #18264a08}
.qtop{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;margin-bottom:10px}
h2{font-size:18px;line-height:1.45;margin:0 0 16px}
.option{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:11px;margin:9px 0;cursor:pointer;transition:.15s}
.option:hover{border-color:#9aacec;background:#f8f9ff}.option input{margin-top:5px;accent-color:var(--accent)}
.option.correct{border-color:#8bc9a7;background:#effaf3}.option.wrong{border-color:#e5a1a4;background:#fff3f3}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:11px;background:#f1f4fb;font-size:14px}
.feedback.show{display:block}.feedback strong{display:block;margin-bottom:5px}
.explain{color:#33415f}.result{display:none;background:white;border:1px solid var(--line);padding:22px;border-radius:16px;margin-top:20px}
.result.show{display:block}.score{font-size:34px;font-weight:800;color:var(--accent)}
.small{color:var(--muted);font-size:13px}.sticky{position:sticky;bottom:0;background:#ffffffed;backdrop-filter:blur(10px);padding:12px 0;border-top:1px solid var(--line);z-index:3}
@media(max-width:560px){.question{padding:15px}h2{font-size:17px}.toolbar{align-items:stretch}.toolbar button{flex:1}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Development of the Kidney &amp; Ureter</h1>
<p>50 challenging single-best-answer MCQs · Medical student level</p>
<div class="stats"><span class="pill">Comprehensive lecture coverage</span><span class="pill">Clinical + factual questions</span><span class="pill">Explanations for every option</span></div>
</div></header>
<main class="wrap">
<div class="toolbar">
<div class="small" id="progressText">Answered 0 of 50</div><div class="progress"><div class="bar" id="bar"></div></div>
<button class="secondary" id="reviewBtn" onclick="toggleUnanswered()">Review unanswered</button>
</div>
<div id="quiz"></div>
<div class="sticky"><div class="wrap" style="display:flex;gap:10px;align-items:center;justify-content:space-between">
<span class="small" id="bottomCount">0 / 50 answered</span><button id="submitBtn" onclick="submitQuiz()">Submit exam</button>
</div></div>
<div class="result" id="result"></div>
</main>
<script>
const QUESTIONS = [{"q": "The urogenital system is derived primarily from which embryonic tissue?", "opts": ["Paraxial mesoderm", "Intermediate mesoderm", "Lateral plate mesoderm", "Endoderm"], "a": 1, "why": "The lecture states that the urogenital system develops from intraembryonic intermediate mesoderm. Paraxial mesoderm forms somites; lateral plate and endoderm do not form the nephrogenic system."}, {"q": "Which part of the urogenital ridge gives rise to the urinary system?", "opts": ["Genital ridge", "Nephrogenic cord", "Paramesonephric duct", "Cloacal membrane"], "a": 1, "why": "The nephrogenic cord is the urinary-system component of the urogenital ridge."}, {"q": "The three kidney systems develop in which sequence?", "opts": ["Mesonephros → pronephros → metanephros", "Pronephros → mesonephros → metanephros", "Metanephros → mesonephros → pronephros", "Pronephros → metanephros → mesonephros"], "a": 1, "why": "The sequence is pronephros (first), mesonephros (second), and metanephros (third and permanent). Their development overlaps in time and space."}, {"q": "The pronephros first develops during the:", "opts": ["Third week", "Beginning of the fourth week", "Fifth week", "Eighth week"], "a": 1, "why": "The pronephros develops in the fourth week, in the cervical region."}, {"q": "The pronephros develops opposite which somites according to the lecture?", "opts": ["1st–7th", "7th–14th", "14th–28th", "28th–35th"], "a": 1, "why": "The pronephros lies opposite the 7th to 14th somites and is formed from seven pairs of nephrotomes."}, {"q": "Which direction does the ventral end of each pronephric tubule open?", "opts": ["Laterally into the mesonephric duct", "Medially into the intraembryonic coelom", "Caudally into the cloaca", "Directly into the dorsal aorta"], "a": 1, "why": "The ventral end opens medially into the intraembryonic coelom; the dorsal ends grow laterally and fuse to form the pronephric duct."}, {"q": "The pronephric duct grows caudally and opens into the:", "opts": ["Amniotic cavity", "Cloaca", "Allantois", "Urogenital sinus"], "a": 1, "why": "The pronephric duct grows caudally and opens into the cloaca on each side."}, {"q": "Which statement correctly describes the fate of the pronephros?", "opts": ["Tubules persist and form nephrons", "Tubules disappear while the duct persists", "Both tubules and duct disappear", "The duct forms the ureteric bud directly after disappearing"], "a": 1, "why": "Pronephric tubules disappear; the pronephric duct persists and is used by the mesonephros."}, {"q": "Approximately how many S-shaped mesonephric tubules are described?", "opts": ["7", "14", "28", "70"], "a": 3, "why": "The lecture describes about 70 S-shaped mesonephric tubules, opposite somites 14–28."}, {"q": "Mesonephric tubules are formed opposite somites:", "opts": ["7–14", "14–28", "28–35", "1–7"], "a": 1, "why": "The stated somite range for mesonephric tubules is 14–28."}, {"q": "The lateral end of a mesonephric tubule opens into the:", "opts": ["Intraembryonic coelom", "Mesonephric (Wolffian) duct", "Cloaca directly", "Collecting duct"], "a": 1, "why": "The lateral end opens into the pronephric duct, which is then called the mesonephric or Wolffian duct."}, {"q": "At the medial end of a mesonephric tubule, a branch from the dorsal aorta contributes to formation of:", "opts": ["Renal pelvis and calyces", "Glomerulus and Bowman's capsule", "Ureter and bladder trigone", "Proximal and distal convoluted tubules only"], "a": 1, "why": "The medial end enlarges and is invaginated by a branch from the dorsal aorta, forming a glomerulus and Bowman's capsule."}, {"q": "Which of the following is a derivative of mesonephric tubules in the male?", "opts": ["Seminal vesicle", "Vasa efferentia", "Vas deferens", "Ejaculatory duct"], "a": 1, "why": "Male mesonephric tubule derivatives listed include vasa efferentia, head of epididymis, paradidymis and aberrant ductules. The duct forms vas deferens and related ducts."}, {"q": "Which structure is derived from the mesonephric duct in the male?", "opts": ["Vasa efferentia", "Body and tail of epididymis", "Head of epididymis", "Paradidymis"], "a": 1, "why": "The duct gives body and tail of epididymis, vas deferens, seminal vesicles and ejaculatory duct. Vasa efferentia and head of epididymis are tubule derivatives."}, {"q": "A remnant of mesonephric tubules in the female is the:", "opts": ["Gartner's duct", "Epoophoron", "Ureter", "Fallopian tube"], "a": 1, "why": "The female mesonephric tubule remnants listed are epoophoron and paroophoron; Gartner's duct is from the mesonephric duct."}, {"q": "Gartner's duct in the female is a remnant of the:", "opts": ["Pronephric tubule", "Mesonephric duct", "Ureteric bud", "Metanephric cap"], "a": 1, "why": "Gartner's duct is listed as a female remnant of the mesonephric (Wolffian) duct."}, {"q": "The permanent kidney (metanephros) first develops in the:", "opts": ["Fourth week", "Fifth week", "Sixth month", "At birth"], "a": 1, "why": "The metanephros develops in the fifth week and becomes the permanent kidney."}, {"q": "The metanephros develops initially in the:", "opts": ["Cervical region", "Thoracic region", "Lower lumbar and sacral regions", "Upper lumbar region only"], "a": 2, "why": "The lecture places the developing metanephros in the lower lumbar and sacral regions before its ascent."}, {"q": "The permanent kidney develops from which two sources?", "opts": ["Pronephric duct and cloaca", "Ureteric bud and metanephric cap", "Mesonephric tubules and dorsal aorta", "Urogenital sinus and allantois"], "a": 1, "why": "The two sources are the ureteric bud and metanephric cap (metanephric mesoderm/blastema)."}, {"q": "The ureteric bud arises as a hollow diverticulum from the:", "opts": ["Upper end of pronephric duct", "Lower end of mesonephric duct near its junction with cloaca", "Metanephric cap", "Dorsal aorta"], "a": 1, "why": "It arises from the lower end of the mesonephric duct at its junction with the cloaca."}, {"q": "Which component forms the collecting system of the kidney?", "opts": ["Metanephric cap", "Ureteric bud", "Mesonephric tubules", "Pronephric tubules"], "a": 1, "why": "The ureteric bud forms the collecting system; the metanephric cap forms the excretory system/nephrons."}, {"q": "Which component forms the excretory system of the kidney?", "opts": ["Ureteric bud", "Metanephric cap", "Mesonephric duct", "Cloaca"], "a": 1, "why": "The metanephric cap forms the excretory units, including the nephron components."}, {"q": "In the lecture's branching sequence, the first bifurcation of the ureteric bud forms the:", "opts": ["Minor calyces", "Renal pelvis", "Major calyces", "Collecting tubules"], "a": 1, "why": "The first bifurcation forms the renal pelvis."}, {"q": "The next four generations of ureteric bud divisions form the:", "opts": ["Major calyces", "Minor calyces", "Renal corpuscles", "Proximal convoluted tubules"], "a": 0, "why": "The lecture specifies: first bifurcation = renal pelvis; next four generations = major calyces; following four = minor calyces."}, {"q": "The following four generations after the major calyces form the:", "opts": ["Renal pelvis", "Minor calyces", "Bowman's capsules", "Ureters"], "a": 1, "why": "The following four generations form the minor calyces."}, {"q": "The remaining generations of ureteric bud branching form the:", "opts": ["Collecting tubules", "Glomeruli", "Loop of Henle", "Distal convoluted tubules"], "a": 0, "why": "The remaining generations become collecting tubules."}, {"q": "The metanephric blastema first forms:", "opts": ["Ureteric buds", "Renal vesicles", "Major calyces", "Mesonephric ducts"], "a": 1, "why": "The blastema forms renal vesicles, which develop into S-shaped metanephric tubules."}, {"q": "A renal vesicle develops into an:", "opts": ["S-shaped tubule", "Ureter", "Renal pelvis", "Epoophoron"], "a": 0, "why": "Renal vesicles develop into S-shaped excretory tubules (nephrons)."}, {"q": "The distal end of the S-shaped metanephric tubule connects with the:", "opts": ["Collecting duct", "Dorsal aorta", "Cloaca directly", "Mesonephric duct"], "a": 0, "why": "The distal end opens into the collecting duct, establishing a passageway for urine."}, {"q": "The proximal end of the S-shaped metanephric tubule is invaginated by a branch from the dorsal aorta to form:", "opts": ["Renal pelvis", "Glomerulus and Bowman's capsule", "Ureteric bud", "Major calyx"], "a": 1, "why": "The proximal end is invaginated by a dorsal aortic branch, forming the glomerulus and Bowman's capsule."}, {"q": "The S-shaped metanephric tubule elongates to form which sequence of nephron segments?", "opts": ["Collecting duct → ureter → renal pelvis", "PCT → loop of Henle → DCT", "Bowman's capsule → ureter → calyx", "Major calyx → minor calyx → collecting duct"], "a": 1, "why": "The S-shaped tubule elongates and coils to form the proximal convoluted tubule, loop of Henle and distal convoluted tubule."}, {"q": "At birth, the kidney normally has which external appearance?", "opts": ["Smooth, with no lobulation ever present", "Lobulated, with lobulation disappearing during infancy", "Permanently deeply lobulated", "Pelvic and lobulated only in males"], "a": 1, "why": "The kidney is lobulated at birth; the lobulation disappears during infancy."}, {"q": "The developing kidney becomes an abdominal organ mainly due to:", "opts": ["Active migration into the thorax", "Growth of the body caudal to it", "Descent of the diaphragm", "Fusion of the lower poles"], "a": 1, "why": "It begins as a pelvic organ and becomes abdominal as the body grows caudal to it."}, {"q": "During its ascent, the kidney's arterial supply changes in which sequence?", "opts": ["Aorta → common iliac → median sacral", "Median sacral → common iliac → abdominal aorta", "Renal artery → median sacral → aorta", "Common iliac → median sacral → renal artery"], "a": 1, "why": "The lecture gives the sequence: median sacral artery in the pelvis, then common iliac artery, finally abdominal aorta; earlier vessels mainly degenerate."}, {"q": "Initially, the renal hilum faces:", "opts": ["Medially", "Posteriorly", "Anteriorly", "Laterally"], "a": 2, "why": "Initially the hilum faces forward (anteriorly), then rotates about 90 degrees to face medially."}, {"q": "Bilateral renal agenesis is associated with:", "opts": ["Polyhydramnios", "Oligohydramnios", "Hydrocephalus", "Persistent fetal lobulation"], "a": 1, "why": "The lecture associates bilateral renal agenesis with oligohydramnios."}, {"q": "Renal agenesis is caused by failure of the:", "opts": ["Metanephric cap to form from dorsal aorta", "Ureteric bud to develop from mesonephric duct", "Pronephric tubules to open into coelom", "Mesonephric tubules to form glomeruli"], "a": 1, "why": "The stated cause is failure of the ureteric bud to develop from the mesonephric duct."}, {"q": "A kidney that remains in the pelvis because it fails to ascend is called:", "opts": ["Horseshoe kidney", "Pelvic kidney", "Double kidney", "Multicystic dysplastic kidney"], "a": 1, "why": "Pelvic kidney results when one kidney fails to ascend and remains in the pelvis."}, {"q": "Fusion of the lower poles of the two kidneys across the midline produces:", "opts": ["Double kidney", "Horseshoe kidney", "Pelvic kidney", "Renal agenesis"], "a": 1, "why": "Horseshoe kidney is due to fusion of the lower poles across the midline."}, {"q": "The ascent of a horseshoe kidney is prevented by the:", "opts": ["Root of inferior mesenteric artery", "Superior mesenteric vein", "Renal vein", "Median sacral artery"], "a": 0, "why": "The lecture identifies the root of the inferior mesenteric artery as the structure preventing ascent."}, {"q": "A duplicated kidney is most directly explained by which developmental event?", "opts": ["Failure of metanephric cap formation", "Early splitting of the ureteric bud", "Failure of kidney ascent", "Persistence of the pronephric tubules"], "a": 1, "why": "The lecture attributes a double kidney to early splitting of the ureteric bud. Failure of ascent produces a pelvic kidney; lower-pole fusion produces a horseshoe kidney."}, {"q": "Congenital polycystic kidney disease, as described in the lecture, results from failed union between: ", "opts": ["Mesonephric duct and cloaca", "Convoluted tubules derived from metanephric cap and collecting tubules derived from ureteric bud", "Ureter and renal pelvis", "Glomerulus and Bowman's capsule"], "a": 1, "why": "The lecture links congenital polycystic kidney to failure of union between the convoluted tubules (metanephric cap origin) and collecting tubules (ureteric bud origin)."}, {"q": "Which inheritance patterns are listed for congenital polycystic kidney disease?", "opts": ["Autosomal recessive and autosomal dominant", "X-linked dominant only", "Mitochondrial only", "Autosomal recessive only"], "a": 0, "why": "Both autosomal recessive and autosomal dominant inheritance are mentioned in the lecture."}, {"q": "Which statement about multicystic dysplastic kidney disease matches the lecture?", "opts": ["It is caused by fusion of the lower poles", "It results from dysmorphology in development of the renal system and generally has a good outcome", "It is always due to WT1 mutation", "It is due to complete splitting of the ureteric bud"], "a": 1, "why": "The lecture describes multicystic dysplastic kidney as resulting from dysmorphology of renal-system development and states that its outcome is generally good."}, {"q": "Wilms tumor is identified in the lecture as a renal cancer associated with mutation of:", "opts": ["WT1 gene", "CFTR gene", "RET gene", "Dystrophin gene"], "a": 0, "why": "The lecture specifically associates Wilms tumor with mutations in the WT1 gene."}, {"q": "Which pairing correctly distinguishes double ureter from bifid ureter?", "opts": ["Double = partial splitting; bifid = complete splitting", "Double = complete splitting; bifid = partial splitting", "Both result from failure of ureteric bud formation", "Both result from fusion of metanephric caps"], "a": 1, "why": "Complete splitting of the ureteric bud produces a double ureter; partial splitting produces a bifid ureter."}, {"q": "A ureteric orifice opens at an abnormal site. This anomaly is called:", "opts": ["Bifid ureter", "Ectopic ureter", "Pelvic kidney", "Accessory renal artery"], "a": 1, "why": "An ectopic ureter is defined by opening of the ureteric orifice at an abnormal site."}, {"q": "Which of the following is listed as a possible ectopic ureter opening in a male?", "opts": ["Vagina", "Uterus", "Prostatic urethra", "Fallopian tube"], "a": 2, "why": "Male sites listed are bladder neck, prostatic urethra, or rectum. Female sites include bladder neck, urethra, vagina, uterus, or rectum."}, {"q": "Accessory renal arteries are embryologically explained by:", "opts": ["Persistence of embryonic blood vessels", "Early splitting of the ureteric bud", "Failure of metanephric blastema differentiation", "Fusion of the lower poles"], "a": 0, "why": "The lecture states that accessory renal arteries represent persistence of embryonic blood vessels."}, {"q": "Which sequence correctly describes the fate of fetal urine during the second half of pregnancy in the lecture?", "opts": ["Urine enters amniotic cavity → fetus swallows fluid → fluid is absorbed into blood and reaches placenta", "Urine enters placenta → swallowed by fetus → stored in bladder", "Urine enters fetal intestine → amniotic cavity → maternal circulation", "Urine is absorbed directly from kidney into placenta without entering amniotic cavity"], "a": 0, "why": "The diagram gives the sequence: fetal urine passes into the amniotic cavity, amniotic fluid is swallowed by the fetus into the intestinal tract, then fluid is absorbed into the bloodstream and reaches the placenta."}];
const letters = ["A","B","C","D"];
const answers = {};
let submitted = false, onlyUnanswered = false;
function render(){
 const root=document.getElementById('quiz'); root.innerHTML='';
 QUESTIONS.forEach((item,i)=>{
  if(onlyUnanswered && answers[i]!==undefined) return;
  const card=document.createElement('section');card.className='question';card.id='q'+i;
  const top=document.createElement('div');top.className='qtop';top.innerHTML=`<span>QUESTION ${i+1} / ${QUESTIONS.length}</span><span>${answers[i]===undefined?'Not answered':'Answered'}</span>`;
  const title=document.createElement('h2');title.textContent=item.q;card.append(top,title);
  item.opts.forEach((opt,j)=>{
   const label=document.createElement('label');label.className='option';
   if(submitted && j===item.a) label.classList.add('correct');
   if(submitted && answers[i]===j && j!==item.a) label.classList.add('wrong');
   const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=j;radio.checked=answers[i]===j;radio.disabled=submitted;
   radio.addEventListener('change',()=>{answers[i]=j;updateProgress();render();});
   const text=document.createElement('span');text.innerHTML=`<b>${letters[j]}.</b> ${escapeHtml(opt)}`;
   label.append(radio,text);card.append(label);
  });
  const fb=document.createElement('div');fb.className='feedback'+(submitted?' show':'');
  if(submitted){
   const head=document.createElement('strong');head.textContent=answers[i]===item.a?'Correct':'Incorrect — correct answer: '+letters[item.a];
   const body=document.createElement('div');body.className='explain';body.textContent=item.why;
   fb.append(head,body);
   const detail=document.createElement('div');detail.style.marginTop='8px';
   detail.innerHTML=item.opts.map((o,j)=>`<div style="margin-top:4px"><b>${letters[j]} ${j===item.a?'✓':'·'}</b> ${escapeHtml(o)} — ${j===item.a?'Correct.':(j===answers[i]?'Your selected option is not correct.':'Not the best answer.')}</div>`).join('');
   fb.append(detail);
  }
  card.append(fb);root.append(card);
 });
 updateProgress();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function updateProgress(){
 const n=Object.keys(answers).length, total=QUESTIONS.length;
 document.getElementById('progressText').textContent=`Answered ${n} of ${total}`;
 document.getElementById('bottomCount').textContent=`${n} / ${total} answered`;
 document.getElementById('bar').style.width=(n/total*100)+'%';
}
function submitQuiz(){
 if(submitted)return;
 const n=Object.keys(answers).length;
 if(n<QUESTIONS.length && !confirm(`You answered ${n} of ${QUESTIONS.length}. Submit anyway? Unanswered questions will count as incorrect.`))return;
 submitted=true;onlyUnanswered=false;render();
 let score=0;QUESTIONS.forEach((q,i)=>{if(answers[i]===q.a)score++;});
 const pct=Math.round(score/QUESTIONS.length*100);
 const result=document.getElementById('result');result.className='result show';
 result.innerHTML=`<div class="small">EXAM RESULT</div><div class="score">${score} / ${QUESTIONS.length}</div><h2>${pct}% — ${pct>=85?'Excellent work':pct>=70?'Good performance':pct>=50?'Keep revising':'Needs more revision'}</h2><p>You can now review every question with its correct answer and explanation.</p><button class="secondary" onclick="window.scrollTo({top:0,behavior:'smooth'})">Review exam</button> <button onclick="restart()">Retake exam</button>`;
 document.getElementById('submitBtn').disabled=true;
 result.scrollIntoView({behavior:'smooth',block:'center'});
}
function toggleUnanswered(){onlyUnanswered=!onlyUnanswered;document.getElementById('reviewBtn').textContent=onlyUnanswered?'Show all questions':'Review unanswered';render();}
function restart(){for(const k in answers)delete answers[k];submitted=false;onlyUnanswered=false;document.getElementById('submitBtn').disabled=false;document.getElementById('result').className='result';document.getElementById('reviewBtn').textContent='Review unanswered';render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script>
</body></html>
